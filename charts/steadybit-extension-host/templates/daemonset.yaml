apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "extensionlib.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "extensionlib.labels" (list .) | nindent 4 }}
  {{- range $key, $value := .Values.extraLabels }}
    {{ $key }}: {{ $value }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "extensionlib.names.name" . }}
      app: {{ include "extensionlib.names.name" . }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "extensionlib.names.name" . }}
        app: {{ include "extensionlib.names.name" . }}
        {{- include "extensionlib.labels" (list .) | nindent 8 }}
        {{- range $key, $value := .Values.extraLabels }}
        {{ $key }}: {{ $value }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if semverCompare "<1.30-0" .Capabilities.KubeVersion.Version }}
        "container.apparmor.security.beta.kubernetes.io/extension": unconfined
        {{- end }}
        {{- include "extensionlib.annotation" (list . .Values.containerPorts.http (list "ACTION" "DISCOVERY") ) | nindent 8 }}
        oneagent.dynatrace.com/injection: "false"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (.Values.priorityClassName | default (dig "priorityClassName" nil (.Values.global | default dict))) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- include "extensionlib.imagePullSecrets" . | nindent 6 }}
      containers:
        - image: {{ include "extensionlib.image" . }}
          imagePullPolicy: {{ include "extensionlib.imagePullPolicy" . }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          name: "extension"
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            - name: health
              containerPort: {{ .Values.containerPorts.health }}
          env:
            - name: STEADYBIT_EXTENSION_PORT
              value: {{ .Values.containerPorts.http | quote }}
            - name: STEADYBIT_EXTENSION_HEALTH_PORT
              value: {{ .Values.containerPorts.health | quote }}
            {{- if .Values.discovery.attributes.excludes.host }}
            - name: STEADYBIT_EXTENSION_DISCOVERY_ATTRIBUTES_EXCLUDES_HOST
              value: {{ join "," .Values.discovery.attributes.excludes.host | quote }}
            {{- end }}
            {{- include "extensionlib.deployment.env" (list .) | nindent 12 }}
            {{- if .Values.tlsIntercept.existingSecret }}
            - name: STEADYBIT_EXTENSION_TLS_INTERCEPT_CA_CERT
              value: /etc/steadybit/tls-intercept/{{ .Values.tlsIntercept.certKey | default "ca.crt" }}
            - name: STEADYBIT_EXTENSION_TLS_INTERCEPT_CA_KEY
              value: /etc/steadybit/tls-intercept/{{ .Values.tlsIntercept.keyKey | default "ca.key" }}
            {{- end }}
            {{- with .Values.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: STEADYBIT_EXTENSION_OCIRUNTIME_DEBUG
              value: {{ .Values.ociRuntime.debug | quote }}
            - name: STEADYBIT_EXTENSION_OCIRUNTIME_ROOT
              value: /run/steadybit/oci
            - name: STEADYBIT_EXTENSION_OCIRUNTIME_PATH
              value: {{ .Values.ociRuntime.path }}
            {{- if .Values.discovery.hostnameFromKubernetes }}
            - name: STEADYBIT_EXTENSION_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.tlsIntercept.existingSecret }}
            - name: tls-intercept-ca
              mountPath: /etc/steadybit/tls-intercept
              readOnly: true
            {{- end }}
            - name: tmp-dir
              mountPath: /tmp
            - name: cgroup-root
              mountPath: /sys/fs/cgroup
            - name: ociruntime-root
              mountPath: /run/steadybit/oci
            {{- include "extensionlib.deployment.volumeMounts" (list .) | nindent 12 }}
          livenessProbe:
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            httpGet:
              path: /health/liveness
              port: {{ .Values.containerPorts.health }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            httpGet:
              path: /health/readiness
              port: {{ .Values.containerPorts.health }}
          securityContext:
            {{- if .Values.privileged }}
            privileged: true
            {{- end }}
            {{- with (include "omitForKuberVersion" (list . "<1.30-0" .Values.containerSecurityContext "appArmorProfile" )) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.tlsIntercept.existingSecret }}
        - name: tls-intercept-ca
          secret:
            secretName: {{ . }}
            # Only the two keys we use, so an unrelated key in the same Secret is
            # never handed to the extension.
            items:
              - key: {{ $.Values.tlsIntercept.certKey | default "ca.crt" }}
                path: {{ $.Values.tlsIntercept.certKey | default "ca.crt" }}
              - key: {{ $.Values.tlsIntercept.keyKey | default "ca.key" }}
                path: {{ $.Values.tlsIntercept.keyKey | default "ca.key" }}
            # No defaultMode: this matches how extensionlib already mounts the
            # extension's own TLS keys, and the binary is setcap'd with
            # DAC_OVERRIDE so it reads them regardless of ownership.
            #
            # optional, unlike extensionlib's certificates, because this is an
            # opt-in feature: a Secret that is missing, renamed, or mid-rotation
            # must not hang every pod in ContainerCreating and take all discovery
            # and every attack on the node down with it.
            optional: true
        {{- end }}
        - name: tmp-dir
          emptyDir: {}
        - name: cgroup-root
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: ociruntime-root
          emptyDir: {}
          {{- include "extensionlib.deployment.volumes" (list .) | nindent 8 }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
          {{- with .Values.nodeSelector }}
      nodeSelector:
          {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.affinity }}
      affinity:
          {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.tolerations }}
      tolerations:
          {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
          {{- toYaml . | nindent 8 }}
          {{- end }}
